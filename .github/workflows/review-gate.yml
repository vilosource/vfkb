name: review-gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  review-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On `pull_request`, checkout defaults to GitHub's synthetic MERGE ref.
          # Its sha is server-generated, and the commit the author actually
          # reviewed sits on the second parent — so a correctly filed
          # reviews/<head-sha>.json would never be found, and the gate would
          # red-light every honest PR. Check out the real head commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The gate diffs against the merge-base with the base branch, and walks
          # commits to decide which shas a record may be filed against. A shallow
          # clone has neither.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # A Brake nobody has watched fail is a Brake nobody knows is connected.
      - name: The gate is connected — negative checks go red
        run: node scripts/review-gate.selftest.mjs

      # An ADR records a DECISION; build state is mutable and belongs in the
      # tracker. docs/adr/README.md already said so and three ADRs did it anyway
      # (ADR-0064 was false within a day) — hence a Brake, not a sentence.
      - name: The ADR lint is connected — negative checks go red
        run: node scripts/adr-lint.selftest.mjs

      - name: ADRs do not assert their own build state
        run: node scripts/adr-lint.mjs

      # Same discipline for the durable-claim Brake (brain gotcha a1aea707436c):
      # it must speak on artifact writes, stay silent on ordinary work, and fail
      # open on garbage. A hook that always speaks gets read past, so the silence
      # cases are asserted as hard as the speaking ones.
      - name: The durable-claim Brake is connected — negative checks go red
        run: node scripts/hook-durable-claim-check.selftest.mjs

      # ADR-0070 §5's own guard, held to ADR-0070's own standard: found wired
      # into NO automated gate by the round-2 review of the PR that introduced
      # it — a guard outside every gate, in the PR whose ADR is about guards
      # nobody watches. Covers the deny/allow directions, fail-open on garbage,
      # and the stdin-watchdog TERMINATES + still-DENIES pair (issue #214).
      - name: The git-compound guard is connected — both directions go red
        run: node scripts/hook-git-compound-guard.selftest.mjs

      # P12-a (ADR-0075 clause 3 / RFC-039 D8). An agent asked to make tests pass
      # has an obvious shortcut — GitHub's own words: "remove the tests, skip the
      # lint step, add `|| true` to test commands". This Brake refuses the four
      # shapes that buy a green run without buying correctness. Its selftest pins
      # the FALSE-POSITIVE half as hard as the true-positive half, because a
      # tamper detector that blocks honest work teaches people to route around
      # the gate, and the routing-around is invisible.
      - name: The tamper detector is connected — both directions go red
        run: node scripts/tamper-check.selftest.mjs

      # NB the fetch is NOT `|| true` and the merge-base is NOT inlined into an
      # argument. The first version did both, so a failed fetch collapsed the
      # base to HEAD^ and the gate scanned ONE COMMIT and printed PASSED — a
      # gate neutered by the very `|| true` it exists to refuse (review M1).
      # tamper-check also refuses to report a verdict when base == head (M2).
      - name: The change did not weaken the suite (tamper detection)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "$BASE_REF" --quiet
          BASE="$(git merge-base "origin/$BASE_REF" HEAD)"
          echo "comparing against merge-base $BASE"
          node scripts/tamper-check.mjs --base "$BASE" --head HEAD

      - name: An implementation change carries a review record (ADR-0052)
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" --quiet || true
          node scripts/review-gate.mjs --base "$BASE"
